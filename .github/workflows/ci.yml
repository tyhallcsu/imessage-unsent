name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Workflows are the one place in this repo with no other gate: shellcheck skips
  # them, and a broken `${{ }}` or a bad `needs:` only surfaces on the run that
  # was supposed to cut a release. actionlint catches the syntax/expression class;
  # zizmor catches the security class (see zizmor.yml for the pinning policy).
  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run actionlint
        # Run as a container rather than via the `rhysd/actionlint` action: that
        # would be this repo's first third-party action, which zizmor.yml requires
        # to be hash-pinned, for no gain over `docker run`.
        #
        # Pinned by DIGEST, not by tag. A Docker tag is mutable — `1.7.7` can be
        # re-pushed — so a tag alone would leave the linter that guards every
        # other workflow silently swappable. The digest makes an upgrade a real
        # commit. Mounted read-only: actionlint only reads.
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

      - name: Run zizmor
        # Version-pinned for the same reason: a bare `pipx run zizmor` installs
        # whatever is latest, so a new release could change findings or config
        # semantics and break CI with no commit to point at.
        #
        # `--offline` so a blocking gate cannot go red because the GitHub API had
        # a bad minute. It is also the mode this baseline was verified in — the
        # online audits (ref-confusion, impostor-commit, known-vulnerable-actions)
        # have never been run against this repo, so enabling them here would ship
        # an unverified gate. Tracked as a follow-up: those audits are the natural
        # compensating control for the `actions/*: ref-pin` policy in zizmor.yml,
        # and are worth turning on once someone can baseline them.
        run: |
          pipx run zizmor==1.29.0 --offline --config zizmor.yml .github/workflows/

  shellcheck:
    name: Shellcheck (all shell sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
      - name: Run shellcheck via Make
        run: make shellcheck

  python-lint:
    name: Python lint (ruff + py_compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install --quiet ruff
      - name: Run python-check via Make
        run: make python-check

  pytest:
    name: pytest (tests/python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install --quiet pytest
      - name: Build deterministic fixture
        run: make fixture
      - name: Run pytest via Make
        run: make python-test

  bats-tests:
    name: bats tests (tests/bats)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache Homebrew bottles
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
          key: brew-bats-core-${{ runner.os }}-v1
          restore-keys: |
            brew-bats-core-${{ runner.os }}-
      - name: Install bats-core
        run: brew install bats-core
      - name: Build deterministic fixture
        run: make fixture
      - name: Fixture rebuild must match the committed bytes
        # The builder pins SQLite's version stamp (issue #165) so a rebuild is
        # reproducible across SQLite versions. If this fails, either the
        # committed fixture is stale or something new drifts per-machine —
        # `git diff tests/fixtures/` shows which file.
        run: git diff --exit-code -- tests/fixtures/
      - name: Run bats
        run: bats tests/bats

  swift-build-daemon:
    name: Swift build + test (daemon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache daemon .build
        uses: actions/cache@v4
        with:
          path: daemon/.build
          key: swift-daemon-${{ runner.os }}-${{ hashFiles('daemon/Package.swift', 'daemon/Sources/**/*.swift', 'daemon/Tests/**/*.swift') }}
          restore-keys: |
            swift-daemon-${{ runner.os }}-
      - name: swift build
        run: swift build --package-path daemon
      - name: swift test
        run: swift test --package-path daemon

  swift-build-gui:
    name: Swift build + test (gui)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache gui .build
        uses: actions/cache@v4
        with:
          path: gui/.build
          key: swift-gui-${{ runner.os }}-${{ hashFiles('gui/Package.swift', 'gui/Sources/**/*.swift', 'gui/Tests/**/*.swift') }}
          restore-keys: |
            swift-gui-${{ runner.os }}-
      - name: swift build
        run: swift build --package-path gui
      - name: swift test
        run: swift test --package-path gui

  readme-link-check:
    name: README link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify README internal links resolve
        run: |
          # crude check: every [..](path) where path starts with ./ or no scheme should exist
          # Strips URL fragments (#section) and query strings (?key=val) before
          # the file existence check so deep links like foo.md#section pass.
          fail=0
          while IFS= read -r line; do
            target="${line#*](}"; target="${target%%)*}"
            case "$target" in
              http*|\#*|mailto:*) continue ;;
              *)
                file="${target%%#*}"
                file="${file%%\?*}"
                [ -e "$file" ] || { echo "Broken link: $target (file: $file)"; fail=1; }
                ;;
            esac
          done < <(grep -oE '\]\([^)]+\)' README.md)
          exit "$fail"

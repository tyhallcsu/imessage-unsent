# Pin the lint rule selection so `make python-check` is reproducible.
#
# CI installs ruff unpinned (`pip install ruff`), and ruff's *default* rule set
# grows between releases. Without this file a new ruff release turns previously
# green code red with no commit in between — which is exactly what happened on
# 2026-08-03, when S/BLE/EXE/PYI/I/ISC/PLW/RUF rules switched on and flagged 35
# findings across files nobody had touched.
#
# This is the historical default (pycodestyle errors + pyflakes) plus E402,
# which the `sys.path.insert(...)` + `# noqa: E402` pattern in
# `scripts/lib/wal_merge_candidates.py`, `scripts/edit-history.py`, and
# `scripts/read-receipts.py` depends on: without E402 enabled those noqa
# directives become "unused" and RUF100 fails instead.
#
# Adding a rule family here is a deliberate act — do it in its own PR with the
# resulting fixes, not as a side effect of a ruff upgrade.
line-length = 100

[lint]
select = ["E4", "E7", "E9", "E402", "F"]
